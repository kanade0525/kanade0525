name: Profile Widgets

# プロフィールに載せる統計の画像を、1日1回まとめて作り直す。
#   assets/stat-*.svg       … 自作の STATUS の窓 (tools/stats.cjs)
#   widgets/*.svg           … GitHub Stats / 使用言語 / メトリクス
#   profile-3d-contrib/*    … 3D コントリビューション
# 公開サーバーが止まっている部品は、本家が配っている Actions 版でここに生成している。

on:
  schedule:
    - cron: "30 21 * * *" # 日本時間 6:30
  workflow_dispatch:
  push:
    branches: [main, widgets]
    paths:
      - tools/**
      - .github/workflows/widgets.yml

permissions:
  contents: write

concurrency:
  group: profile-widgets-${{ github.ref_name }}
  cancel-in-progress: true

env:
  # 外から借りてきた Action に渡すのは、このリポジトリ用の GITHUB_TOKEN だけ。
  # 本人のトークン (GH_TOKEN) と WakaTime のトークンは、自作の tools/stats.cjs にしか渡さない
  DARK: bg_color=000000&title_color=ffffff&text_color=ffffff&icon_color=5cc6f2&border_color=ffffff&ring_color=f7d51d&border_radius=0
  LIGHT: bg_color=ffffff&title_color=333333&text_color=333333&icon_color=1479a8&border_color=212529&ring_color=a88a00&border_radius=0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---- 自作の窓 ----
      # フォント (Nuあんこもち) は再頒布できないので、このリポジトリには置かない。
      # ポートフォリオで使っているものを、作るときだけ借りてくる
      - uses: actions/checkout@v4
        with:
          repository: kanade0525/portfolio
          path: .portfolio
          sparse-checkout: font

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm i --no-save opentype.js@1.3.4

      - name: STATUS の窓
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: |
          FONT="$(find .portfolio/font -name 'NuAnkoMochi-Reg.otf' | head -n 1)"
          test -n "$FONT"
          FONT="$FONT" node tools/stats.cjs

      # ---- GitHub Stats / 使用言語 ----
      - name: GitHub Stats (dark)
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&${{ env.DARK }}
          path: widgets/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: GitHub Stats (light)
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&${{ env.LIGHT }}
          path: widgets/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: 使用言語 (dark)
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&${{ env.DARK }}
          path: widgets/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: 使用言語 (light)
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&${{ env.LIGHT }}
          path: widgets/top-langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ---- 3D コントリビューション ---- (profile-3d-contrib/ に出る)
      - name: 3D コントリビューション
        continue-on-error: true
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # ---- メトリクス ---- (output_action: none だと /metrics_renders に出る)
      - name: メトリクス
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics.svg
          output_action: none
          template: classic
          base: header, activity, community, metadata
          config_timezone: Asia/Tokyo
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          # languages / habits / achievements と base の repositories は、GITHUB_TOKEN では
          # このリポジトリしか見えず「Unexpected error」や「1 Repository」になるので外している。
          # 本人のトークンを渡せば出せるが、外の Action に渡すことになるので本人の判断を待つ
      - name: メトリクスを置く
        continue-on-error: true
        run: |
          mkdir -p widgets
          sudo cp /metrics_renders/metrics.svg widgets/metrics.svg
          sudo chown "$(id -u):$(id -g)" widgets/metrics.svg

      - name: 変わっていればコミットする
        run: |
          ls -la widgets profile-3d-contrib 2>/dev/null || true
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add assets/stat-*.svg
          git add widgets profile-3d-contrib 2>/dev/null || true
          git diff --staged --quiet && exit 0
          git commit -m "chore: 統計の画像を更新"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
